<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>安速 - 未入仓运单</title>
  <style>
    :root {
      --brand: #1592ff;
      --brand-dark: #0879dc;
      --brand-soft: #e7f4ff;
      --danger: #ff4d2e;
      --success: #12a86b;
      --warning: #ff8a00;
      --text: #263645;
      --muted: #7b8994;
      --line: #e4e9ef;
      --line-soft: #edf1f5;
      --sidebar: #edf7ff;
      --page: #f3f6f9;
      --white: #fff;
      --shadow: 0 2px 12px rgba(23, 45, 68, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 1280px;
      min-height: 100vh;
      color: var(--text);
      background: var(--page);
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      font-size: 14px;
      letter-spacing: 0;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .shell {
      display: grid;
      grid-template-columns: 220px 1fr;
      height: 100vh;
      min-height: 100vh;
      overflow: hidden;
    }

    .sidebar {
      position: relative;
      background: var(--sidebar);
      border-right: 1px solid #deedf8;
      display: flex;
      flex-direction: column;
    }

    .logo {
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.42);
    }

    .logo-mark {
      width: 38px;
      height: 24px;
      position: relative;
    }

    .logo-mark::before,
    .logo-mark::after {
      content: "";
      position: absolute;
      bottom: 2px;
      border-radius: 3px 3px 1px 1px;
      transform-origin: bottom;
    }

    .logo-mark::before {
      width: 10px;
      height: 22px;
      left: 9px;
      background: #ff8b00;
      transform: skewX(-28deg);
    }

    .logo-mark::after {
      width: 10px;
      height: 28px;
      left: 20px;
      background: #df1e26;
      transform: skewX(-28deg);
    }

    .logo-main {
      color: #e3272d;
      font-weight: 800;
      font-size: 18px;
      line-height: 1;
    }

    .logo-sub {
      color: #777f88;
      font-size: 11px;
      margin-top: 3px;
      white-space: nowrap;
    }

    .menu {
      padding: 14px 0 26px;
      overflow: auto;
      flex: 1;
    }

    .menu-item {
      width: 100%;
      height: 52px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 22px 0 26px;
      color: #344758;
      background: transparent;
      border-left: 3px solid transparent;
      text-align: left;
    }

    .menu-item svg {
      width: 17px;
      height: 17px;
      stroke-width: 2;
      color: #52616d;
      flex: 0 0 auto;
    }

    .menu-item .chev {
      margin-left: auto;
      width: 14px;
      height: 14px;
    }

    .menu-item.active {
      color: var(--brand);
      background: #dff3ff;
      border-left-color: var(--brand);
    }

    .menu-item.active svg {
      color: var(--brand);
    }

    .sidebar-bottom {
      height: 42px;
      display: grid;
      place-items: center;
      color: #52616d;
      border-top: 1px solid #d8ebf8;
    }

    .main {
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .topbar {
      height: 50px;
      background: var(--white);
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--line-soft);
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 28px;
      height: 100%;
      padding-left: 20px;
    }

    .nav button {
      min-width: 92px;
      height: 40px;
      padding: 0 18px;
      border-radius: 24px;
      color: #101820;
      background: transparent;
      font-weight: 700;
      white-space: nowrap;
    }

    .nav button.active {
      color: #fff;
      background: var(--brand);
      box-shadow: 0 4px 12px rgba(21, 146, 255, 0.28);
    }

    .top-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 0 22px;
    }

    .quick-order {
      height: 35px;
      padding: 0 19px;
      color: #fff;
      background: var(--brand);
      border-radius: 2px;
      font-weight: 700;
    }

    .bell {
      position: relative;
      color: #2b3e4f;
    }

    .bell svg {
      width: 22px;
      height: 22px;
    }

    .badge {
      position: absolute;
      top: -11px;
      right: -10px;
      min-width: 20px;
      height: 20px;
      border-radius: 999px;
      color: #fff;
      background: #ff5a5f;
      font-size: 12px;
      display: grid;
      place-items: center;
      border: 2px solid #fff;
    }

    .user {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #334;
      white-space: nowrap;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      background: #66c95f;
      font-weight: 700;
    }

    .tabsbar {
      height: 38px;
      background: var(--white);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 20px;
      border-bottom: 1px solid var(--line-soft);
    }

    .hamburger,
    .tiny-arrow {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      color: #314252;
      background: transparent;
    }

    .tab {
      height: 30px;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 0 12px;
      color: #687785;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 2px;
      white-space: nowrap;
    }

    .tab.active {
      color: #fff;
      background: var(--brand);
      border-color: var(--brand);
    }

    .content {
      min-height: 0;
      flex: 1;
      padding: 12px 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .filter-card,
    .table-card {
      background: var(--white);
      border-radius: 3px;
      box-shadow: var(--shadow);
    }

    .filter-card {
      padding: 14px 14px 13px;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(4, minmax(270px, 1fr));
      column-gap: 34px;
      row-gap: 2px;
      padding: 0 0 10px;
    }

    .field {
      display: grid;
      grid-template-columns: 82px minmax(0, 1fr);
      align-items: center;
      min-width: 0;
      gap: 8px;
    }

    .field label {
      justify-self: end;
      color: #303e4c;
      font-weight: 700;
      white-space: nowrap;
    }

    .field input,
    .field select {
      width: 100%;
      height: 30px;
      border: 1px solid #d9dee5;
      color: #4d5b68;
      background: #fff;
      padding: 0 12px;
      outline: 0;
      border-radius: 2px;
    }

    .field input::placeholder {
      color: #b6c0ca;
    }

    .date-range {
      display: grid;
      grid-template-columns: 1fr 28px 1fr 30px;
      align-items: center;
    }

    .date-range input {
      min-width: 0;
      border-right: 0;
      height: 30px;
    }

    .date-range input + span {
      height: 30px;
      display: grid;
      place-items: center;
      color: #abb5bf;
      border-top: 1px solid #d9dee5;
      border-bottom: 1px solid #d9dee5;
    }

    .date-range .calendar {
      border: 1px solid #d9dee5;
      border-left: 0;
      height: 30px;
      color: #abb5bf;
      display: grid;
      place-items: center;
    }

    .filter-actions {
      display: flex;
      gap: 14px;
      padding-left: 0;
      margin-left: 0;
    }

    .primary {
      height: 36px;
      min-width: 70px;
      padding: 0 18px;
      color: #fff;
      background: var(--brand);
      border-radius: 2px;
      font-weight: 700;
    }

    .secondary {
      height: 36px;
      min-width: 70px;
      padding: 0 18px;
      color: #354656;
      background: #fff;
      border: 1px solid #d8dee5;
      border-radius: 2px;
      font-weight: 700;
    }

    .table-card {
      min-height: 0;
      flex: 1;
      padding: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 12px;
    }

    .tool-button {
      height: 36px;
      min-width: 82px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 15px;
      color: #fff;
      background: var(--brand);
      border-radius: 2px;
      font-weight: 700;
      white-space: nowrap;
    }

    .tool-button:hover,
    .primary:hover,
    .quick-order:hover {
      background: var(--brand-dark);
    }

    .tool-button.danger {
      background: var(--danger);
    }
    .tool-button.danger:hover {
      background: #e04426;
    }

    .tool-dropdown {
      position: relative;
      display: inline-flex;
    }
    .tool-dropdown .tool-button {
      min-width: 82px;
    }
    .dropdown-menu {
      position: absolute;
      top: 100%;
      left: 0;
      margin-top: 2px;
      min-width: 140px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 2px;
      box-shadow: var(--shadow);
      z-index: 15;
      display: none;
      overflow: hidden;
    }
    .dropdown-menu.show {
      display: block;
    }
    .dropdown-menu button {
      display: block;
      width: 100%;
      height: 34px;
      padding: 0 14px;
      color: #354656;
      background: #fff;
      text-align: left;
      white-space: nowrap;
    }
    .dropdown-menu button:hover {
      background: var(--brand-soft);
    }

    .gear {
      margin-left: auto;
      width: 43px;
      min-width: 43px;
      padding: 0;
    }

    .table-shell {
      min-height: 0;
      flex: 1;
      border: 1px solid var(--line);
      overflow: auto;
      background: #fff;
    }

    table {
      width: 100%;
      min-width: 1890px;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th,
    td {
      height: 36px;
      border-right: 1px solid var(--line-soft);
      border-bottom: 1px solid var(--line-soft);
      padding: 0 10px;
      color: #566574;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 2;
      color: #3c4a56;
      background: #f7f9fb;
      font-weight: 800;
    }

    tbody tr:hover {
      background: #f8fcff;
    }

    .idx {
      width: 48px;
      color: #798795;
    }

    .check {
      width: 52px;
    }

    .waybill {
      color: #168cff;
      font-weight: 700;
      cursor: pointer;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 58px;
      height: 24px;
      padding: 0 8px;
      color: #fff;
      background: #0a9af0;
      border-radius: 2px;
      font-weight: 700;
    }

    .status-warn {
      color: #fff;
      background: #ff5a1f;
      border-radius: 2px;
      padding: 4px 9px;
      font-weight: 800;
    }

    .status-done {
      color: #fff;
      background: #15a8f4;
      border-radius: 2px;
      padding: 4px 9px;
      font-weight: 800;
    }

    .count-red {
      color: #ff2c1e;
      font-weight: 800;
    }

    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--brand);
    }

    .pagination {
      height: 46px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
      color: #263645;
      padding: 8px 2px 0;
      white-space: nowrap;
    }

    .page-btn,
    .page-num {
      height: 28px;
      min-width: 28px;
      padding: 0 8px;
      background: #fff;
      color: #314252;
      border: 1px solid transparent;
      border-radius: 2px;
    }

    .page-num.active {
      color: var(--brand);
      border-color: var(--brand);
    }

    .page-size,
    .jump-input {
      height: 30px;
      border: 1px solid #d8dee5;
      color: #354656;
      border-radius: 2px;
      background: #fff;
      padding: 0 8px;
    }

    .jump-input {
      width: 52px;
      text-align: center;
    }

    .float-tools {
      position: fixed;
      right: 17px;
      bottom: 250px;
      display: grid;
      gap: 10px;
      z-index: 6;
    }

    .float-tools button {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      background: #f08bb1;
      box-shadow: 0 4px 12px rgba(240, 139, 177, 0.35);
    }

    .toast {
      position: fixed;
      top: 82px;
      left: 50%;
      transform: translateX(-50%);
      max-width: 360px;
      padding: 12px 24px;
      color: #fff;
      background: var(--danger);
      border-radius: 4px;
      box-shadow: var(--shadow);
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: 0.2s ease;
      z-index: 20;
    }

    .toast.show {
      opacity: 1;
    }

    .material-check-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px 16px;
    }
    .material-check-grid label {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #3b4a58;
      cursor: pointer;
    }
    .material-check-grid input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--brand);
    }

    .modal-mask {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(30, 46, 62, 0.3);
      z-index: 30;
    }

    .modal-mask.show {
      display: flex;
    }

    .modal {
      width: 520px;
      background: #fff;
      border-radius: 6px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.18);
      overflow: hidden;
    }

    .modal-head {
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid var(--line-soft);
      font-weight: 800;
    }

    .modal-close {
      width: 30px;
      height: 30px;
      background: transparent;
      color: #6c7884;
      font-size: 24px;
      line-height: 1;
    }

    .modal-body {
      padding: 18px;
    }

    .column-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px 16px;
    }

    .column-grid label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #3b4a58;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 0 18px 18px;
    }

    @media (max-width: 1500px) {
      .filters {
        grid-template-columns: repeat(2, minmax(330px, 1fr));
        column-gap: 34px;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="logo" aria-label="ANSU 安速">
        <div class="logo-mark"></div>
        <div>
          <div class="logo-main">ANSU</div>
          <div class="logo-sub">安速捷运</div>
        </div>
      </div>
      <nav class="menu" id="sideMenu"></nav>
      <div class="sidebar-bottom">‹</div>
    </aside>

    <main class="main">
      <header class="topbar">
        <nav class="nav" id="mainNav"></nav>
        <div class="top-actions">
          <button class="quick-order" id="quickOrder">直客录单</button>
          <div class="bell" title="消息">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 7h18s-3 0-3-7"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span class="badge">3</span>
          </div>
          <div class="user">
            <span class="avatar">人</span>
            <span>天朗</span>
          </div>
          <button class="tiny-arrow">›</button>
        </div>
      </header>

      <div class="tabsbar">
        <button class="hamburger" title="菜单">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <button class="tiny-arrow">‹</button>
        <div class="tab">预报下单 ×</div>
        <div class="tab">预留仓 ×</div>
        <div class="tab">运单 ×</div>
        <div class="tab active">未入仓运单 ×</div>
      </div>

      <section class="content">
        <section class="filter-card">
          <div class="filters" id="filters"></div>
          <div class="filter-actions">
            <button class="primary" id="searchBtn">搜 索</button>
            <button class="secondary" id="resetBtn">重 置</button>
          </div>
        </section>

        <section class="table-card">
          <div class="toolbar" id="toolbar"></div>
          <div class="table-shell">
            <table>
              <thead id="tableHead"></thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
          <div class="pagination" id="pagination"></div>
        </section>
      </section>
    </main>
  </div>

  <div class="float-tools">
    <button title="快捷工具">⌘</button>
    <button title="客服">达</button>
  </div>

  <div class="toast" id="toast"></div>

  <div class="modal-mask" id="materialModal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="materialTitle">
      <div class="modal-head">
        <span id="materialTitle">批量修改材质</span>
        <button class="modal-close" id="closeMaterialModal">×</button>
      </div>
      <div class="modal-body">
        <p style="margin:0 0 12px;color:#3b4a58;font-weight:700;">请选择新材质（可多选）：</p>
        <div class="material-check-grid" id="materialCheckGrid">
          <label><input type="checkbox" data-material="普货" />普货</label>
          <label><input type="checkbox" data-material="纺织品" />纺织品</label>
          <label><input type="checkbox" data-material="带电" />带电</label>
          <label><input type="checkbox" data-material="带磁" />带磁</label>
          <label><input type="checkbox" data-material="液体" />液体</label>
          <label><input type="checkbox" data-material="粉末" />粉末</label>
          <label><input type="checkbox" data-material="化妆品" />化妆品</label>
        </div>
      </div>
      <div class="modal-actions">
        <button class="secondary" id="cancelMaterial">取 消</button>
        <button class="primary" id="applyMaterial">确 定</button>
      </div>
    </div>
  </div>

  <div class="modal-mask" id="columnModal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="columnTitle">
      <div class="modal-head">
        <span id="columnTitle">列设置</span>
        <button class="modal-close" id="closeModal">×</button>
      </div>
      <div class="modal-body">
        <div class="column-grid" id="columnGrid"></div>
      </div>
      <div class="modal-actions">
        <button class="secondary" id="showAllColumns">全部显示</button>
        <button class="primary" id="applyColumns">确 定</button>
      </div>
    </div>
  </div>

  <script>
    const icons = {
      user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>',
      users: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
      file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8M16 17H8M10 9H8"/></svg>',
      box: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.27 6.96 12 12.01l8.73-5.05"/><path d="M12 22.08V12"/></svg>',

        const waybill = batch === 0 ? baseWaybills[base] : baseWaybills[base].replace(/\d{4}$/, String(1400 + i).slice(-4));

        records.push({
          id: "row-" + i,
          waybill,
          fba: fbas[base] || (i % 5 === 0 ? "FBA19D" + String(900000 + i) : ""),
          forecastNo: i % 3 === 1 ? "YBSAZS2605260089" : i % 6 === 0 ? "YBSAZS2605270204" : "YBDGAS2605260102",

    function getFilteredRecords() {
      const filters = state.filters;
      const multiMatch = (value, query) => {
        if (!query) return true;
        const parts = query.split(/[\s,，]+/).filter(Boolean);
        return parts.some(part => String(value || "").toLowerCase().includes(part.toLowerCase()));
      };

      return state.records.filter(record => {
        if (!multiMatch(record.forecastNo, filters.forecastNo)) return false;
        if (!multiMatch(record.waybill, filters.waybill)) return false;
        if (!multiMatch(record.fba, filters.fba)) return false;
        if (!multiMatch(record.customer, filters.customer)) return false;
        if (!multiMatch(record.channel, filters.channel)) return false;
        if (!multiMatch(record.warehouse, filters.warehouse)) return false;
        if (filters.invoice && record.invoice !== filters.invoice) return false;
        if (filters.reportType && record.reportType !== filters.reportType) return false;
        if (filters.sales && !multiMatch(record.sales, filters.sales)) return false;
        if (filters.follow && !multiMatch(record.follow, filters.follow)) return false;
        if (filters.receiveType && record.receiveType !== filters.receiveType) return false;
        if (filters.approved && record.approved !== filters.approved) return false;
        if (filters.unit && !multiMatch(record.unit, filters.unit)) return false;
        if (filters.hasReturn && record.hasReturn !== filters.hasReturn) return false;
        return true;
      });
    }

      const pageRows = filtered.slice(start, start + state.pageSize);

      document.getElementById("tableBody").innerHTML = pageRows.map((record, index) => `<tr>
        ${visibleColumns.map(col => renderCell(col, record, start + index)).join("")}
      </tr>`).join("");

      const pageIds = pageRows.map(row => row.id);

    function renderCell(col, record, absoluteIndex) {
      if (col.key === "idx") return `<td class="idx">${absoluteIndex + 1}</td>`;

      }
      if (col.key === "waybill") return `<td><span class="waybill" data-open="${record.id}">${record.waybill}</span></td>`;
      if (col.key === "shipType") return `<td><span class="tag">${record.shipType}</span></td>`;
      if (col.key === "invoice") {
        const cls = record.invoice === "已制作发票" ? "status-done" : "status-warn";
        return `<td><span class="${cls}">${record.invoice}</span></td>`;
      }
      if (col.key === "pieces") return `<td><span class="count-red">${record.pieces}</span></td>`;
      return `<td title="${record[col.key] || ""}">${record[col.key] || ""}</td>`;
    }

    function renderPagination(total, totalPages) {
      const pages = [];
      const current = state.page;
      for (let i = 1; i <= totalPages; i++) {
        if (i === 1 || i === totalPages || Math.abs(i - current) <= 2) {
          pages.push(`<button class="page-num ${i === current ? "active" : ""}" data-page="${i}">${i}</button>`);
        } else if (pages[pages.length - 1] !== "<span>···</span>") {
          pages.push("<span>···</span>");
        }
      }
      document.getElementById("pagination").innerHTML = `
        <span>共 ${total} 条</span>
        <button class="page-btn" data-step="-1">‹</button>
        ${pages.join("")}
        <button class="page-btn" data-step="1">›</button>

        <span>页</span>

    function exportCsv() {
      const rows = selectedRecords().length ? selectedRecords() : getFilteredRecords();
      const exportColumns = columns.filter(col => !["idx", "check"].includes(col.key) && state.visible.has(col.key));
      const csv = [
        exportColumns.map(col => col.label).join(","),
        ...rows.map(row => exportColumns.map(col => `"${String(row[col.key] || "").replace(/"/g, '""')}"`).join(","))
      ].join("\n");
      const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `未入仓运单-${new Date().toISOString().slice(0, 10)}.csv`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      toast(`已导出 ${rows.length} 条数据`);
    }

        toast(`当前菜单：${item.dataset.menu}`);
      });

      document.getElementById("searchBtn").addEventListener("click", collectFilters);
      document.getElementById("resetBtn").addEventListener("click", resetFilters);
      document.getElementById("quickOrder").addEventListener("click", () => toast("直客录单入口已打开"));

      document.getElementById("toolbar").addEventListener("click", event => {
        if (event.target.id === "batchBtn") {
          document.getElementById("batchMenu").classList.toggle("show");
          return;
        }
        const gear = event.target.closest("#gearBtn");
        if (gear) {
          renderColumnsModal();
          document.getElementById("columnModal").classList.add("show");
          return;
        }
        const button = event.target.closest("[data-action]");
        if (button) toolbarAction(button.dataset.action);
      });

      document.addEventListener("click", event => {
        if (!event.target.closest(".tool-dropdown")) {
          document.getElementById("batchMenu").classList.remove("show");
        }
      });

      document.getElementById("tableHead").addEventListener("change", event => {
        if (event.target.id !== "selectAll") return;
        const checked = event.target.checked;
        const filtered = getFilteredRecords();
        const start = (state.page - 1) * state.pageSize;
        filtered.slice(start, start + state.pageSize).forEach(row => {
          if (checked) state.selected.add(row.id);
          else state.selected.delete(row.id);
        });
        renderTable();
      });

      document.getElementById("tableBody").addEventListener("change", event => {
        const checkbox = event.target.closest(".row-check");
        if (!checkbox) return;
        if (checkbox.checked) state.selected.add(checkbox.dataset.id);
        else state.selected.delete(checkbox.dataset.id);
        renderTable();
      });

      document.getElementById("tableBody").addEventListener("click", event => {
        const waybill = event.target.closest("[data-open]");
        if (!waybill) return;
        const row = state.records.find(item => item.id === waybill.dataset.open);
        toast(`打开运单 ${row.waybill}：${row.customer} / ${row.channel}`);
      });

      document.getElementById("pagination").addEventListener("click", event => {
        const page = event.target.closest("[data-page]");
        const step = event.target.closest("[data-step]");
        const totalPages = Math.max(1, Math.ceil(getFilteredRecords().length / state.pageSize));
        if (page) state.page = Number(page.dataset.page);
        if (step) state.page = Math.min(totalPages, Math.max(1, state.page + Number(step.dataset.step)));
        if (page || step) renderTable();
      });

      document.getElementById("pagination").addEventListener("change", event => {
        if (event.target.id !== "pageSize") return;
        state.pageSize = Number(event.target.value);
        state.page = 1;
        renderTable();
      });

      document.getElementById("pagination").addEventListener("keydown", event => {
        if (event.target.id !== "jumpPage" || event.key !== "Enter") return;
        const totalPages = Math.max(1, Math.ceil(getFilteredRecords().length / state.pageSize));
        const page = Number(event.target.value);
        if (Number.isFinite(page) && page >= 1) {
          state.page = Math.min(totalPages, page);
          renderTable();
        }
      });

      document.getElementById("closeModal").addEventListener("click", () => {
        document.getElementById("columnModal").classList.remove("show");
      });
      document.getElementById("columnModal").addEventListener("click", event => {
        if (event.target.id === "columnModal") event.currentTarget.classList.remove("show");
      });
      document.getElementById("showAllColumns").addEventListener("click", () => {
        state.visible = new Set(columns.map(col => col.key));
        renderColumnsModal();
      });
      document.getElementById("applyColumns").addEventListener("click", () => {
        const next = new Set(["idx", "check"]);
        document.querySelectorAll("[data-column]").forEach(input => {
          if (input.checked) next.add(input.dataset.column);
        });
        state.visible = next;
        document.getElementById("columnModal").classList.remove("show");
        renderTable();
        toast("列显示已更新");
      });

      // 批量修改材质弹窗事件
      document.getElementById("closeMaterialModal").addEventListener("click", () => {
        document.getElementById("materialModal").classList.remove("show");
      });
      document.getElementById("materialModal").addEventListener("click", event => {
        if (event.target.id === "materialModal") event.currentTarget.classList.remove("show");
      });
      document.getElementById("cancelMaterial").addEventListener("click", () => {
        document.getElementById("materialModal").classList.remove("show");
      });
      document.getElementById("applyMaterial").addEventListener("click", () => {
        const selectedMaterials = Array.from(document.querySelectorAll("#materialCheckGrid input:checked")).map(cb => cb.dataset.material);
        if (selectedMaterials.length === 0) {
          toast("请选择材质");
          return;
        }
        const newMaterial = selectedMaterials.join(",");
        const selected = selectedRecords();
        selected.forEach(row => { row.material = newMaterial; });
        document.getElementById("materialModal").classList.remove("show");
        renderTable();
        toast(`已将 ${selected.length} 条运单材质修改为「${newMaterial}」`);
      });
    }

    function init() {
      state.records = buildRecords();
      renderNav();
      renderMenu();
      renderFilters();
      renderToolbar();
      renderTable();
      bindEvents();
    }

    init();
  </script>
</body>
</html>
